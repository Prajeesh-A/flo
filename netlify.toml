[build]
  command = "pnpm install --no-frozen-lockfile && pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "9"
  NEXT_PUBLIC_API_URL = "https://floneo-backend-production.up.railway.app/api"

# Enable Next.js SSR Runtime
[[plugins]]
  package = "@netlify/plugin-nextjs"
