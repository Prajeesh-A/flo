# Floneo Backend — Railway Deployment
# Railway auto-detects Python + Gunicorn.
# This file tells Railway exactly how to build and start the app.
# It replaces the Render build.sh for Railway's build system.

[build]
builder = "nixpacks"
# nixpacks automatically runs: pip install -r requirements.txt (install phase)
# DO NOT repeat pip install here — it doubles build time (was 25+ min)
buildCommand = "python manage.py collectstatic --noinput"

[deploy]
startCommand = "python manage.py migrate --noinput && gunicorn floneo_backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
# Runs BEFORE gunicorn starts — ensures DB tables exist before first request
releaseCommand = "python manage.py migrate --noinput"
healthcheckPath = "/health/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

